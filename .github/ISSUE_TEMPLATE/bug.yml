name: Bug
description: The dashboard, the pipeline or the docs do not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happens
      description: What you did, what you saw and what you expected.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: A link to the page, the workflow run or the file.
