name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *" # every day at 04:17 UTC
  workflow_dispatch:

# One run at a time: a data refresh and a code push must not race.
# Pull requests get their own group so they never cancel a pending main run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pipeline' }}
  cancel-in-progress: false

# A job that needs more sets its own permissions, which replace these.
permissions:
  contents: read

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # CI: checks, then data refresh on schedule or manual run.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .

  data:
    name: Data
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a stalled download must not hold the group for hours
    permissions:
      contents: write # the refresh commits data/events
    outputs:
      # The commit that the image and the mirror use: the data commit when the
      # refresh pushed one, else the commit this run checked out.
      sha: ${{ steps.commit.outputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Refresh live sources
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m tracker.ingest live
      - name: Validate stored data
        run: python -m tracker.ingest check
      - name: Run the tests
        run: pytest
      - name: Commit refreshed data
        id: commit
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events
          git diff --cached --quiet || (git commit -m "data: refresh live sources" && git pull --rebase && git push)
          # After the push: the rebase can move HEAD.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Beside the data job, so a stale page or broken docs never block a refresh.
  docs:
    name: Docs
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt -r docs/requirements.txt
      - name: Check the architecture page
        run: python scripts/architecture.py --check
      - name: Build docs
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

  # CD, from main only. Each job does nothing until its variable or secret is set.
  image:
    name: Docker image
    needs: [data, docs]
    if: github.ref == 'refs/heads/main' && vars.DOCKER_IMAGE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.data.outputs.sha }}
      - name: Publish Docker image
        id: image
        env:
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Same image inputs (the files the Dockerfile copies), same tag.
          tag=$(git ls-tree HEAD Dockerfile requirements.txt .streamlit src data | sha256sum | cut -c1-12)
          echo "image=$DOCKER_IMAGE:$tag" >> "$GITHUB_OUTPUT"
          echo "$DOCKERHUB_TOKEN" | docker login -u "${DOCKER_IMAGE%%/*}" --password-stdin
          if docker manifest inspect "$DOCKER_IMAGE:$tag" > /dev/null 2>&1; then
            echo "$DOCKER_IMAGE:$tag is already published"
          else
            docker build -t "$DOCKER_IMAGE:$tag" -t "$DOCKER_IMAGE:latest" .
            docker push --all-tags "$DOCKER_IMAGE"
          fi

  deploy:
    name: Deploy to Render
    needs: image
    if: needs.image.outputs.image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          # A secret cannot gate a step: skip here until it is set.
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set, deploy skipped"
            exit 0
          fi
          # The exact tag of this run, not whatever latest points to.
          curl -fsS --get --data-urlencode "imgURL=docker.io/$IMAGE" -o /dev/null "$RENDER_DEPLOY_HOOK_URL"

  mirror:
    name: Hugging Face mirror
    needs: data
    if: github.ref == 'refs/heads/main' && vars.HF_DATASET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # the Hugging Face mirror signs in with the run OIDC token
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.data.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Mirror the data to Hugging Face
        env:
          HF_DATASET: ${{ vars.HF_DATASET }}
          HF_OIDC_RESOURCE: datasets/${{ vars.HF_DATASET }}
        run: |
          url=$(hf upload "$HF_DATASET" data/events . --repo-type dataset --commit-message "data: mirror $(git rev-parse --short HEAD)" --quiet)
          echo "$url"
          # Read back the commit of this run (the latest commit when nothing changed), not whatever main points to.
          copy=$(mktemp -d)
          hf download "$HF_DATASET" --repo-type dataset --revision "${url##*/}" --local-dir "$copy" > /dev/null
          for file in data/events/*; do
            cmp -s "$file" "$copy/$(basename "$file")" || { echo "Mirror check failed: $(basename "$file") is missing or differs on $HF_DATASET"; exit 1; }
          done
          echo "Mirror check passed: $HF_DATASET matches data/events"
