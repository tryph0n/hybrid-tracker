name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *" # every day at 04:17 UTC
  workflow_dispatch:

# One run at a time: a data refresh and a code push must not race.
# Pull requests get their own group so they never cancel a pending main run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pipeline' }}
  cancel-in-progress: false

permissions:
  contents: write # the refresh commits data/events

env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a stalled download must not hold the group for hours
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt ruff==0.17.6 huggingface_hub==2.4.0

      # CI: checks, then data refresh on schedule or manual run.
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Refresh live sources
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m tracker.ingest live
      - name: Validate stored data
        run: python -m tracker.ingest check
      - name: Smoke-test the app
        run: python -c "from streamlit.testing.v1 import AppTest; at = AppTest.from_file('src/streamlit_app.py', default_timeout=60); at.run(); assert not at.exception, at.exception"
      - name: Commit refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events
          git diff --cached --quiet || (git commit -m "data: refresh live sources" && git pull --rebase && git push)

      # CD, from main only. Each step is skipped until its variable is set.
      - name: Publish Docker image
        id: image
        if: github.ref == 'refs/heads/main' && vars.DOCKER_IMAGE != ''
        env:
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Same image inputs (the files the Dockerfile copies), same tag.
          tag=$(git ls-tree HEAD Dockerfile requirements.txt .streamlit src data | sha256sum | cut -c1-12)
          echo "image=$DOCKER_IMAGE:$tag" >> "$GITHUB_OUTPUT"
          echo "$DOCKERHUB_TOKEN" | docker login -u "${DOCKER_IMAGE%%/*}" --password-stdin
          if docker manifest inspect "$DOCKER_IMAGE:$tag" > /dev/null 2>&1; then
            echo "$DOCKER_IMAGE:$tag is already published"
          else
            docker build -t "$DOCKER_IMAGE:$tag" -t "$DOCKER_IMAGE:latest" .
            docker push --all-tags "$DOCKER_IMAGE"
          fi
      - name: Deploy to Hugging Face Space
        if: steps.image.outputs.image != '' && vars.HF_SPACE_ID != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: python scripts/deploy_space.py
