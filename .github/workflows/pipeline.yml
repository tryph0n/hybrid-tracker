name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *" # every day at 04:17 UTC
  workflow_dispatch:

# One run at a time: a data refresh and a code push must not race.
# Pull requests get their own group so they never cancel a pending main run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pipeline' }}
  cancel-in-progress: false

# A job that needs more sets its own permissions, which replace these.
permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # CI: checks, then data refresh on schedule or manual run.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run --locked mypy

  data:
    name: Data
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a stalled download must not hold the group for hours
    permissions:
      contents: read
      id-token: write # the raw store signs in with the run OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install
        run: uv sync --locked
      - name: Refresh live sources
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TRACKER_STORE: hf
          HF_OIDC_RESOURCE: datasets/sam-bot/hybrid-tracker-raw
        run: uv run tracker ingest live
      - name: Ingest static sources missing from the store
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TRACKER_STORE: hf
          HF_OIDC_RESOURCE: datasets/sam-bot/hybrid-tracker-raw
        run: uv run tracker ingest static --if-missing
      - name: Build the published tables
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TRACKER_STORE: hf
          HF_OIDC_RESOURCE: datasets/sam-bot/hybrid-tracker-raw
        run: uv run tracker build
      - name: Write the quality table and the run summary
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TRACKER_STORE: hf
          HF_OIDC_RESOURCE: datasets/sam-bot/hybrid-tracker-raw
        run: uv run tracker quality
      - name: Keep the published tables for the publish job
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-tables
          path: build
          if-no-files-found: error
          retention-days: 3
      - name: Run the tests
        run: uv run pytest --cov --cov-report=term --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"

  # Beside the data job, so a stale page or broken docs never block a refresh.
  docs:
    name: Docs
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install
        run: uv sync --locked --group docs
      - name: Check the architecture page
        run: uv run python scripts/architecture.py --check
      - name: Build docs
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

  # Pull requests only: build the image and start it, so a broken Dockerfile
  # fails before the merge. It pushes nothing and needs no secret.
  image-check:
    name: Docker build check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: hybrid-tracker:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the user and the health check
        run: |
          docker inspect hybrid-tracker:check --format 'User={{.Config.User}} Healthcheck={{json .Config.Healthcheck}}'
          test -n "$(docker inspect hybrid-tracker:check --format '{{.Config.User}}')"
          test "$(docker inspect hybrid-tracker:check --format '{{.Config.User}}')" != root
          test "$(docker inspect hybrid-tracker:check --format '{{.Config.Healthcheck}}')" != "<nil>"
      - name: Start the container and wait for the health answer
        run: |
          docker run -d --name check -p 8501:8501 hybrid-tracker:check
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8501/_stcore/health || true)
            echo "attempt $i: /_stcore/health answered $code"
            [ "$code" = 200 ] && break
            sleep 2
          done
          if [ "$code" != 200 ]; then docker logs check; exit 1; fi
          # The Docker health check has its own start period: poll the status too.
          for i in $(seq 1 24); do
            status=$(docker inspect check --format '{{.State.Health.Status}}')
            echo "container health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 5
          done
          docker logs check
          exit 1

  # CD, from main only. Each job does nothing until its variable or secret is set.
  image:
    name: Docker image
    needs: [data, docs]
    if: github.ref == 'refs/heads/main' && vars.DOCKER_IMAGE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the attestation is signed with the run OIDC token
      attestations: write
      artifact-metadata: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Name the image and check the registry
        id: image
        env:
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The snapshot of the published events is an image input too, but not a
          # file of the repository: pin the head of the NonCommercial dataset now,
          # so the build and the tag use the same revision.
          head=$(curl -fsS "https://huggingface.co/api/datasets/sam-bot/europe-hybrid-incidents-nc/commits/main" | jq -r '.[0] | "\(.id) \(.date[:10])"')
          snapshot_revision=${head% *}
          snapshot_date=${head#* }
          echo "snapshot revision $snapshot_revision of $snapshot_date"
          # Same image inputs (the files the Dockerfile copies and the snapshot), same tag.
          files=$(git ls-tree HEAD Dockerfile README.md pyproject.toml uv.lock .streamlit src | sha256sum | cut -c1-64)
          tag=$(echo "$files $snapshot_revision" | sha256sum | cut -c1-12)
          echo "image=$DOCKER_IMAGE:$tag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "snapshot_revision=$snapshot_revision" >> "$GITHUB_OUTPUT"
          echo "snapshot_date=$snapshot_date" >> "$GITHUB_OUTPUT"
          echo "$DOCKERHUB_TOKEN" | docker login -u "${DOCKER_IMAGE%%/*}" --password-stdin
          # A tag counts as published only when it also has an attestation of
          # this repository. Otherwise it is built again, from this run, so
          # the provenance names this commit and this run.
          if docker buildx imagetools inspect "$DOCKER_IMAGE:$tag" > /dev/null 2>&1 \
            && gh attestation verify "oci://index.docker.io/$DOCKER_IMAGE:$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$DOCKER_IMAGE:$tag is already published and attested"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Buildx
        if: steps.image.outputs.published != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build once into the local daemon and scan it, so a vulnerable image is
      # never pushed. A push straight to the registry is what carries the
      # BuildKit attestations, so the image is built a second time for it (the
      # cache makes that cheap).
      - name: Build the image for the scan
        if: steps.image.outputs.published != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          build-args: |
            IMAGE_TAG=${{ steps.image.outputs.tag }}
            SNAPSHOT_REVISION=${{ steps.image.outputs.snapshot_revision }}
            SNAPSHOT_DATE=${{ steps.image.outputs.snapshot_date }}
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image and write the report
        if: steps.image.outputs.published != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          format: table
          output: trivy-report.txt
          exit-code: "0"
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      - name: Add the report to the job summary
        if: steps.image.outputs.published != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          {
            echo "### Vulnerability report for $IMAGE"
            echo
            echo '```'
            cat trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on a critical finding that has a fix
        if: steps.image.outputs.published != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL
      # Only the tag is pushed here. latest moves after the attestation.
      - name: Publish the image with its provenance
        id: push
        if: steps.image.outputs.published != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: mode=max
          build-args: |
            IMAGE_TAG=${{ steps.image.outputs.tag }}
            SNAPSHOT_REVISION=${{ steps.image.outputs.snapshot_revision }}
            SNAPSHOT_DATE=${{ steps.image.outputs.snapshot_date }}
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
      - name: Attest the build provenance
        if: steps.image.outputs.published != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: index.docker.io/${{ vars.DOCKER_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Move latest to the attested image
        if: steps.image.outputs.published != 'true'
        env:
          DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: docker buildx imagetools create --tag "$DOCKER_IMAGE:latest" "$DOCKER_IMAGE@$DIGEST"

  deploy:
    name: Deploy to Render
    needs: image
    if: needs.image.outputs.image != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15 # 10 minutes of polling, 5 for the deploy call
    steps:
      - name: Deploy to Render
        id: deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          # A secret cannot gate a step: skip here until it is set.
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set, deploy skipped"
            exit 0
          fi
          # The exact tag of this run, not whatever latest points to.
          curl -fsS --get --data-urlencode "imgURL=docker.io/$IMAGE" -o /dev/null "$RENDER_DEPLOY_HOOK_URL"
          echo "called=true" >> "$GITHUB_OUTPUT"
      - name: Wait for the new image to answer
        if: steps.deploy.outputs.called == 'true'
        env:
          APP_URL: https://hybrid-tracker.onrender.com
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          # The image writes its tag to /app/static/version.txt. A free service
          # sleeps and needs about a minute to start: early requests can fail.
          tag="${IMAGE##*:}"
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            served=$(curl -fsS --max-time 15 "$APP_URL/app/static/version.txt" 2>/dev/null | tr -d '[:space:]' || true)
            echo "expected $tag, served '${served:0:40}'"
            if [ "$served" = "$tag" ]; then
              echo "$APP_URL serves $tag"
              exit 0
            fi
            sleep 15
          done
          echo "$APP_URL did not serve $tag within 10 minutes"
          exit 1

  # One step per dataset: a Trusted Publisher token writes to one repository only.
  publish:
    name: Hugging Face publish
    needs: data
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # the publisher signs in with the run OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install
        run: uv sync --locked
      - name: Get the published tables
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published-tables
          path: build
      - name: Publish the open dataset
        env:
          HF_OIDC_RESOURCE: datasets/sam-bot/europe-hybrid-incidents
        run: uv run tracker publish open
      - name: Publish the NonCommercial dataset
        env:
          HF_OIDC_RESOURCE: datasets/sam-bot/europe-hybrid-incidents-nc
        run: uv run tracker publish nc

  # Alerts. They run on a scheduled or manual run only, never on a pull request
  # or a push. Every job of the run is listed in needs, so a failure in any of
  # them is seen. Each job does nothing until its secret is set, where it needs one.
  report-failure:
    name: Report failure
    needs: [lint, data, docs, image, deploy, publish]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open an issue, or comment on the open one
        run: |
          gh label create pipeline-failure --force --color B60205 --description "A scheduled or manual pipeline run failed"
          open=$(gh issue list --label pipeline-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "The pipeline failed again: $RUN_URL"
          else
            gh issue create --label pipeline-failure \
              --title "Pipeline run failed" \
              --body "A $GITHUB_EVENT_NAME run of the pipeline failed: $RUN_URL. See the runbook in the maintainer guide. The next successful scheduled run closes this issue."
          fi

  # One issue per source with a cause, with the label source-alert (not the label
  # of close-failure, which would close it). It needs the data job to succeed:
  # when that job fails, there is no alerts.json and report-failure speaks.
  source-alerts:
    name: Source alerts
    needs: [data]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install
        run: uv sync --locked
      - name: Get the alerts of the quality check
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published-tables
          path: build
      - name: Open, comment on or close the alert issues
        run: uv run tracker alerts --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  close-failure:
    name: Close failure issue
    needs: [lint, data, docs, image, deploy, publish]
    if: ${{ !failure() && !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Close the open failure issues
        run: |
          for number in $(gh issue list --label pipeline-failure --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "The scheduled run succeeded: $RUN_URL"
          done

  heartbeat:
    name: Heartbeat
    needs: [lint, data, docs, image, deploy, publish]
    if: ${{ !failure() && !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the heartbeat monitor
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          # A secret cannot gate a step: skip here until it is set.
          if [ -z "$HEARTBEAT_URL" ]; then
            echo "HEARTBEAT_URL is not set, heartbeat skipped"
            exit 0
          fi
          curl -fsS --retry 3 -o /dev/null "$HEARTBEAT_URL"
          echo "Heartbeat sent"
