name: storage-probe

on:
  push:
    branches: [docs/39-storage-layout]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Write one file to the raw store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # the upload signs in with the run OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install
        run: uv sync --locked
      - name: Write one file to the raw store
        env:
          HF_OIDC_RESOURCE: datasets/sam-bot/hybrid-tracker-raw
        run: |
          echo "storage probe, run $GITHUB_RUN_ID, commit $GITHUB_SHA" > probe.txt
          uv run hf upload sam-bot/hybrid-tracker-raw probe.txt probe/probe.txt --repo-type dataset --commit-message "chore: storage probe $GITHUB_RUN_ID"
